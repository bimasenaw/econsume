<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — EcoConsume AI</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fef3c7;
        color: #1e293b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card { max-width: 420px; text-align: center; }
      .badge {
        width: 64px; height: 64px; border-radius: 20px;
        background: linear-gradient(135deg, #10b981, #2dd4bf);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 32px; margin-bottom: 16px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #475569; line-height: 1.6; margin: 0 0 20px; }
      button {
        cursor: pointer; border: 0; border-radius: 14px; padding: 12px 20px;
        background: #10b981; color: #fff; font-weight: 700; font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #020617; color: #e2e8f0; }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">🌿</div>
      <h1>Anda sedang offline</h1>
      <p>
        Halaman ini belum tersimpan untuk akses offline. Data stok, Eco-Score, dan catatan Anda tetap
        aman di perangkat dan akan tersedia kembali saat koneksi pulih.
      </p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
